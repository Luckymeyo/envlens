DATABASE_URL:
  type: url
  required: true
  description: Database connection string.

PORT:
  type: integer
  required: true
  default: 3000
  description: Local web server port.

NODE_ENV:
  type: enum
  values: [development, test, production]
  default: development
  description: Runtime environment.

PUBLIC_API_URL:
  type: url
  required: true
  public: true
  description: Public API base URL used by the frontend.

NEXT_PUBLIC_API_URL:
  type: url
  required: true
  public: true
  description: Next.js public API base URL.

STRIPE_SECRET_KEY:
  type: string
  required: true
  secret: true
  description: Stripe server-side API key.

AUTH_SECRET:
  type: string
  required: true
  secret: true
  description: Server-side authentication signing secret.

HOST:
  type: string
  required: true
  description: API bind host.

APP_ENV:
  type: enum
  values: [development, test, production]
  default: development
  description: Application environment.

WEB_PORT:
  type: integer
  required: true
  default: 3000
  description: Web app port in the monorepo example.

API_PORT:
  type: integer
  required: true
  default: 8000
  description: API app port in the monorepo example.
