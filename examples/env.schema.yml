DATABASE_URL:
  type: url
  required: true
  description: Database connection string.

PORT:
  type: integer
  required: true
  default: 3000
  description: Local web server port.

NODE_ENV:
  type: enum
  values: [development, test, production]
  default: development
  description: Runtime environment.

PUBLIC_API_URL:
  type: url
  required: true
  public: true
  description: Public API base URL used by the frontend.

STRIPE_SECRET_KEY:
  type: string
  required: true
  secret: true
  description: Stripe server-side API key.

