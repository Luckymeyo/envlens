DATABASE_URL:
  type: url
  required: true
  description: Database connection URL.

HOST:
  type: string
  default: 127.0.0.1
  description: API bind host.

PORT:
  type: integer
  default: 8000
  description: API bind port.

APP_ENV:
  type: enum
  values: [development, test, production]
  default: development
  description: Application environment.

