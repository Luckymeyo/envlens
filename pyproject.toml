[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envlens"
version = "0.1.0"
description = "Find missing, stale, unsafe, and mistyped environment variables before they break production."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Luckymeyo" }
]
keywords = ["dotenv", "environment", "configuration", "cli", "ci", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Luckymeyo/envlens"
Repository = "https://github.com/Luckymeyo/envlens"
Issues = "https://github.com/Luckymeyo/envlens/issues"

[project.scripts]
envlens = "envlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.envlens]
example = ".env.example"
schema = "env.schema.yml"

